<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover : l'appli utilise tout l'écran, y compris autour de l'encoche de l'iPhone -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF6EE">
  <meta name="description" content="ArwinFelin — le carnet de vie de vos chats : santé, poids, souvenirs et rappels.">
  <title>ArwinFelin</title>

  <!-- Polices d'écriture (Google Fonts) : Fredoka pour les titres, Nunito pour le texte -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">

  <!-- Thème appliqué AVANT l'affichage, pour éviter un flash blanc en mode sombre -->
  <script>
    (function () {
      var mode = localStorage.getItem('af-theme') || 'auto';
      var dark = mode === 'dark' || (mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">

  <!-- Appli installable (PWA) -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ArwinFelin">
</head>
<body>
  <div class="shell">
    <!-- Chaque écran est dessiné ici par JavaScript -->
    <main id="view" class="view" tabindex="-1"></main>

    <!-- Barre de navigation du bas -->
    <nav class="tabbar" aria-label="Navigation principale">
      <a href="#/" data-tab="home"><span data-icon="home"></span>Accueil</a>
      <a href="#/sante" data-tab="health"><span data-icon="health"></span>Santé</a>
      <a href="#/journal" data-tab="journal"><span data-icon="journal"></span>Journal</a>
      <a href="#/rappels" data-tab="reminders"><span data-icon="bell"></span>Rappels</a>
      <a href="#/profil" data-tab="profile"><span data-icon="user"></span>Profil</a>
    </nav>
  </div>

  <!-- Zone des petits messages (toasts) -->
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- Chart.js (bibliothèque de graphiques) chargée depuis un CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

  <!-- Les scripts, dans l'ordre : les outils, puis le routeur (app.js), puis les écrans.
       L'appli démarre automatiquement quand toute la page est chargée. -->
  <script src="js/utils.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/db.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/cat-form.js"></script>
  <script src="js/views/cat-detail.js"></script>
  <script src="js/health.js"></script>
  <script src="js/reminders-core.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/races.js"></script>
  <script src="js/races-details.js"></script>
  <script src="js/breed-ai.js"></script>
  <script src="js/views/health.js"></script>
  <script src="js/views/weight.js"></script>
  <script src="js/views/food.js"></script>
  <script src="js/views/journal.js"></script>
  <script src="js/views/reminders.js"></script>
  <script src="js/views/profile.js"></script>
  <script src="js/views/breeds.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/share.js"></script>
</body>
</html>
